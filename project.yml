name: ZundaNavi
options:
  bundleIdPrefix: dev.momo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  ZundaNavi:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: ずんだナビ
        CFBundleShortVersionString: "0.2.1"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
          - location
        NSMicrophoneUsageDescription: 声でずんだもんに質問するためにマイクを使います。
        NSSpeechRecognitionUsageDescription: 「ふぇーぶる」の呼びかけを端末内で聞き取るために使います。
        NSLocationAlwaysAndWhenInUseUsageDescription: 画面を閉じていても現在地に合わせて案内するために使います。
        NSLocationWhenInUseUsageDescription: 現在地に合わせて案内するために使います。
        NSCameraUsageDescription: 状況を写真で見せるためにカメラを使います。
        NSPhotoLibraryUsageDescription: 撮った写真を選んで送るために使います。
        NSLocalNetworkUsageDescription: 同じネットワーク内のサーバーにつなぐために使います。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.momo.zundanavi
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
